name: Deploy to Cloudflare Pages

# OPTION B — deploy from GitHub Actions with Wrangler.
# Use this if you do NOT want the Cloudflare Git integration to run the build.
# (If you connect the repo in the Cloudflare dashboard — Option A in
#  docs/CLOUDFLARE_PAGES.md — you can delete this file; CI alone is enough.)
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   API token with "Cloudflare Pages — Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  32-char account id (dashboard right-hand sidebar)
#
# Token: https://dash.cloudflare.com/profile/api-tokens -> Create Token ->
#        "Edit Cloudflare Workers"/"Cloudflare Pages: Edit" + your zone/account.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Cloudflare Pages branch to deploy to (main = production)'
        required: false
        default: 'main'

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc   # same Node as Cloudflare Pages / local nvm
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # pages:build = vite build + scripts/check-build-output.mjs
      - name: Build
        run: npm run pages:build

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Project name must match `name` in wrangler.jsonc / your Pages project.
          command: pages deploy --project-name=pwparent --branch=${{ github.event.inputs.branch || 'main' }} --commit-dirty=true
          # Secrets (GEMINI_API_KEY etc.) are set once with `wrangler pages secret put`,
          # never through this workflow.

      - name: Deployment summary
        if: always()
        run: |
          echo "### Cloudflare Pages deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.event.inputs.branch || 'main' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Output dir: \`dist\`" >> $GITHUB_STEP_SUMMARY
          echo "- URL: https://pwparent.pages.dev (production) / preview URL is in the deploy log" >> $GITHUB_STEP_SUMMARY
